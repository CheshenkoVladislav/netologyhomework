apiVersion: v1
kind: Service
metadata:
  name: service-1
spec:
  type: ClusterIP
  selector:
    app: nginx-1
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-1
  labels:
    app.kubernetes.io/name: ingress-1
spec:
  rules:
  - host: localhost
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: service-1
            port: 
              number: 80


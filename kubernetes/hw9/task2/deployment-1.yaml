apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-1-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Kubernetes NGINX</title>
        <style>body { font-family: sans-serif; text-align: center; margin-top: 10%; }</style>
    </head>
    <body>
        <h1>Hello from Kubernetes ConfigMap!</h1>
        <p>This HTML and NGINX config are fully decoupled from the container image.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-1
  template:
    metadata:
      labels:
        app: nginx-1
    spec:
      volumes:
        - name: config-map
          configMap:
            name: nginx-1-config
      containers:
      # - name: multitool
      #   image: wbitt/network-multitool:3.22
      #   resources:
      #     requests:
      #       memory: "128Mi"
      #       cpu: "150m"
      #     limits:
      #       memory: "128Mi"
      #       cpu: "250m"
      #   env:
      #   - name: HTTP_PORT
      #     value: "8080"
      #   - name: HTTPS_PORT
          # value: "8443"
      - name: nginx
        image: nginx:1.19.0
        resources:
          requests:
            memory: "128Mi"
            cpu: "150m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-map
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html

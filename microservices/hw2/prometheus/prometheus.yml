scrape_configs:
- job_name: cadvisor
  scrape_interval: 5s
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: services
  scrape_interval: 10s
  static_configs:
  - targets:
    - uploader:3000
    - security:3000
- job_name: storage
  scrape_interval: 10s
  metrics_path: /minio/v2/metrics/cluster
  static_configs:
  - targets:
    - storage:9000
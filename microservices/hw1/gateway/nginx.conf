# /etc/nginx/nginx.conf или /etc/nginx/sites-available/api-gateway

events {
    worker_connections 1024;
}

http {
    upstream security {
        server security:3000;
    }
    
    upstream uploader {
        server uploader:3000;
    }
    
    upstream minio {
        server storage:9000;
    }
    
    server {
        listen 80;
        server_name api.example.com;

        location = /internal/token/validation {
            internal;
            proxy_pass http://security/v1/token/validation;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location /v1/register {
            auth_basic off;

            proxy_pass http://security/v1/user;
        }

        location /v1/token {
            auth_basic off;

            proxy_pass http://security/v1/token;
        }


        location /v1/user {
            auth_request /internal/token/validation;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://security/v1/user;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /v1/upload {
            auth_request /internal/token/validation;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://uploader/v1/upload;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ~  ^/v1/user/(?<image>[^/]+)$ {
            auth_request /internal/token/validation;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://minio/images/${image};
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}

